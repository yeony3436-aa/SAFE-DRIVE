waypoint_follower:
  ros__parameters:
    use_sim_time: true
    drive_mode: ackermann
    wheelbase: 2.5
    max_steer: 0.65
    target_speed: 8.0
    goal_tolerance: 0.7
    lookahead_distance: 0.7
    max_linear_speed: 8.0
    max_angular_speed: 0.6
    max_linear_deceleration: 0.05
    turn_entry_x: -12.0
    # Preserve the validated tight-corner speed after the faster approach.
    turn_speed: 0.8
    turn_deceleration: 1.0
    straight_tracking_enabled: true
    straight_end_x: -20.0
    straight_lateral_gain: 0.04
    straight_heading_gain: 0.5
    control_rate_hz: 20.0
    odom_timeout: 0.5
    # Eastbound approach, 4.6 m radius right turn, then extended southbound lane.
    waypoint_x: [-200.0, -130.0, -60.0, -10.0, -6.0, -4.35, -3.16, -2.05, -1.10, -0.37, 0.09, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
    waypoint_y: [-1.75, -1.75, -1.75, -1.75, -1.75, -1.75, -1.91, -2.37, -3.10, -4.05, -5.16, -6.35, -10.0, -13.0, -16.0, -19.0, -22.0, -24.0, -26.0, -28.0, -29.0, -30.0]
