waypoint_follower:
  ros__parameters:
    use_sim_time: true

    target_speed: 2.0
    goal_tolerance: 0.5
    lookahead_distance: 1.5
    max_linear_speed: 3.0
    max_angular_speed: 1.0
    max_linear_deceleration: 1.0
    control_rate_hz: 20.0
    odom_timeout: 0.5

    # Straight route in the right-hand lane from the default spawn position.
    waypoint_x: [-10.0, 0.0, 10.0]
    waypoint_y: [-1.75, -1.75, -1.75]
